<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="730" viewBox="0 0 1060 730" role="img"><title>Flujo de mejora · resultado separado del estado</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#387466"/></marker></defs>
<rect width="1060" height="730" fill="white"/>
<text x="30" y="35" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173b35">Flujo de mejora · resultado separado del estado</text>
<rect x="30" y="90" width="300" height="102" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="46" y="120" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">1. Desviación</text>
<text x="46" y="148" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Observación, canal y periodo</text>
<text x="46" y="173" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Demo: incidencias 6%</text>
<rect x="390" y="90" width="300" height="102" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="406" y="120" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">2. Diagnóstico</text>
<text x="406" y="148" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Problema, causa y evidencia</text>
<text x="406" y="173" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Objetivo: 3% · borrador</text>
<rect x="750" y="90" width="280" height="102" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="766" y="120" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">3. Acciones</text>
<text x="766" y="148" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Responsables y plazos</text>
<text x="766" y="173" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Activar el plan</text>
<rect x="750" y="345" width="280" height="102" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="766" y="375" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">4. Seguimiento</text>
<text x="766" y="403" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Revisiones: 4,5% y 3%</text>
<text x="766" y="428" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Periodos mensuales</text>
<rect x="390" y="345" width="300" height="102" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="406" y="375" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">5. Evaluación</text>
<text x="406" y="403" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Valor inicial / meta / actual</text>
<text x="406" y="428" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Logro, mejora o sin datos</text>
<rect x="30" y="345" width="300" height="102" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="46" y="375" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">6. Finalización</text>
<text x="46" y="403" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Razones y confirmación</text>
<text x="46" y="428" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Instantánea e histórico</text>
<polyline points="330,140 390,140" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="690,140 750,140" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="890,192 890,345" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750,395 690,395" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="390,395 330,395" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="555" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#173b35">Borrador → en progreso ⇄ en revisión → cerrado. Cancelación posible desde estados abiertos.</text>
<text x="30" y="595" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#173b35">Cerrar no exige éxito: puede conservar acciones pendientes o resultados no evaluables.</text>
<text x="30" y="635" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#173b35">La evaluación es interna e informativa. SAP no cambia el estado de tiendas ni pagos en Mirakl.</text></svg>
