<text x="41" y="818" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">PK id · FK plan</text>
<text x="41" y="843" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">kind · description · responsible*</text>
<text x="41" y="868" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">due_date · status · evidence</text>
<text x="41" y="893" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">revision · request_key UNIQUE</text>
<rect x="405" y="760" width="310" height="127" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="421" y="790" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">PlanMetric</text>
<text x="421" y="818" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">PK id · FK plan / baseline</text>
<text x="421" y="843" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">target_value · revision</text>
<text x="421" y="868" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">UNIQUE plan + baseline</text>
<rect x="785" y="760" width="310" height="152" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="801" y="790" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">PlanReview</text>
<text x="801" y="818" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">PK id · FK plan_metric</text>
<text x="801" y="843" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">FK recorded_by → User</text>
<text x="801" y="868" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">period · value · order_count</text>
<text x="801" y="893" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">comments · assessment</text>
<polyline points="335,142 405,142" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="130" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#173b35">1:N</text>
<polyline points="470,207 470,320 190,320 190,385" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="210" y="310" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#173b35">Seller 1:N planes</text>
<polyline points="650,207 650,310 850,310 850,385" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="695" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#173b35">Seller 1:N observaciones</text>
<polyline points="980,232 980,385" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="992" y="320" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#173b35">1:N</text>
<polyline points="190,587 190,760" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="202" y="682" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#173b35">1:N</text>
<polyline points="355,530 560,530 560,760" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="378" y="514" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#173b35">Plan 1:N objetivos</text>
<polyline points="785,465 685,465 685,760" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="695" y="610" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#173b35">1:N</text>
<polyline points="715,822 785,822" fill="none" stroke="#387466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="733" y="808" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#173b35">1:N</text>
<text x="25" y="960" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">FK de dominio: PROTECT. User tiene dos relaciones 1:N con ImprovementPlan y una con PlanReview.</text>
<text x="25" y="987" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">* PlanAction.responsible es texto (persona/equipo), no FK. User–Group–Permission: relaciones M:N nativas.</text></svg>
