<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1030" viewBox="0 0 1120 1030" role="img"><title>Modelo entidad-relación · entidades y FK de dominio</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#387466"/></marker></defs>
<rect width="1120" height="1030" fill="white"/>
<text x="30" y="35" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173b35">Modelo entidad-relación · entidades y FK de dominio</text>
<rect x="25" y="80" width="310" height="127" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="41" y="110" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">auth.User</text>
<text x="41" y="138" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">PK id · username</text>
<text x="41" y="163" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">Grupos y permisos Django</text>
<text x="41" y="188" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">is_staff / is_superuser</text>
<rect x="405" y="80" width="310" height="127" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="421" y="110" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">Seller</text>
<text x="421" y="138" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">PK id · reference UNIQUE</text>
<text x="421" y="163" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">FK owner → User</text>
<text x="421" y="188" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">name · created_at</text>
<rect x="785" y="80" width="310" height="152" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="801" y="110" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">ThresholdPolicy</text>
<text x="801" y="138" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">PK id · code + version UNIQUE</text>
<text x="801" y="163" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">unit · operator · alarm</text>
<text x="801" y="188" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">suspension · minimum_orders</text>
<text x="801" y="213" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">is_mqc</text>
<rect x="25" y="385" width="330" height="202" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="41" y="415" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">ImprovementPlan</text>
<text x="41" y="443" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">PK id · FK seller</text>
<text x="41" y="468" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">FK created_by / responsible</text>
<text x="41" y="493" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">problem · root_cause · evidence</text>
<text x="41" y="518" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">objective · dates · status</text>
<text x="41" y="543" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">revision · request_key UNIQUE</text>
<text x="41" y="568" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">closure_notes / evaluation</text>
<rect x="785" y="385" width="310" height="127" rx="10" fill="#f1f7f4" stroke="#83ad9c"/>
<text x="801" y="415" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173b35">QualityMetric</text>
<text x="801" y="443" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">PK id · FK seller / policy</text>
<text x="801" y="468" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">channel · period_start / end</text>
<text x="801" y="493" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#173b35">order_count · value</text>
